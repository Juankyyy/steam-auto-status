[package]
name = "steam-auto-status"
version = "0.2.0"
description = "Cambia el estado de Steam (Invisible/Conectado) segun un horario"
authors = ["Juankyyy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` adds the PNG decoder used to load the tray icons (state-dependent).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

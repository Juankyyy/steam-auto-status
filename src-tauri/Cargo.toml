[package]
name = "steam-auto-status"
version = "0.4.0"
description = "Cambia el estado de Steam (Invisible/Conectado) segun un horario"
authors = ["Juankyyy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` adds the PNG decoder used to load the tray icons (state-dependent).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local time for the schedule, log timestamps and the tray tooltip.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# Toolhelp (detect steam.exe) and ShellExecuteW (open the steam:// handler) with no
# `cmd` wrapper in between.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Release: builds the NSIS installer on Windows and attaches it to the tag's release.
#
# - Pushing a `vX.Y.Z` tag: sets the version from the tag, builds and publishes the
#   release with the installer attached (name: steam-auto-status_X.Y.Z_x64-setup.exe).
#   The release title comes from the notes first line (`<!-- title: ... -->`).
# - workflow_dispatch: only builds and leaves the installer as an artifact, to test
#   the pipeline without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cargo cache (Rust build)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bundled Node runtime cache
        uses: actions/cache@v4
        with:
          path: src-tauri/runtime
          key: node-runtime-v24.12.0-win-x64

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          node scripts/set-version.mjs $version

      - name: Build (sidecar + runtime + app + installer)
        run: npm run build

      - name: Locate installer
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $asset = "src-tauri/target/release/bundle/nsis/steam-auto-status_${version}_x64-setup.exe"
          if (-not (Test-Path $asset)) { throw "Installer not found: $asset" }
          "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "release-notes/$tag.md"

          # Release title: the first line of the notes file carries it as a hidden HTML
          # comment, e.g. `<!-- title: v0.2.0 - The Settings Update -->`. The tag stays the
          # source of truth for the version; fallback is the historic default title.
          $title = "Steam Auto Status $tag"
          if (Test-Path $notes) {
            $first = Get-Content $notes -TotalCount 1
            if ($first -match '^\s*<!--\s*title:\s*(.+?)\s*-->\s*$') { $title = $Matches[1] }
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The release already existed: update the installer and, when curated, the
            # title/notes too.
            gh release upload $tag $env:ASSET --clobber
            if (Test-Path $notes) {
              gh release edit $tag --title $title --notes-file $notes
            } else {
              gh release edit $tag --title $title
            }
          } else {
            $args = @('release', 'create', $tag, $env:ASSET, '--title', $title)
            if (Test-Path $notes) { $args += @('--notes-file', $notes) } else { $args += '--generate-notes' }
            if ($tag -match '-') { $args += '--prerelease' }
            gh @args
          }

      - name: Upload installer artifact (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ${{ env.ASSET }}

# Release: compila el instalador NSIS en Windows y lo adjunta a la release del tag.
#
# - Push de un tag `vX.Y.Z`: fija la versión desde el tag, compila y publica la
#   release con el instalador adjunto (nombre: steam-auto-status_X.Y.Z_x64-setup.exe).
# - workflow_dispatch: solo compila y deja el instalador como artifact, para probar
#   el pipeline sin publicar nada.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Caché de cargo (build de Rust)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Caché del runtime de Node empaquetado
        uses: actions/cache@v4
        with:
          path: src-tauri/runtime
          key: node-runtime-v24.12.0-win-x64

      - name: Instalar dependencias
        run: npm ci

      - name: Fijar versión desde el tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          node scripts/set-version.mjs $version

      - name: Compilar (sidecar + runtime + app + instalador)
        run: npm run build

      - name: Localizar instalador
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $asset = "src-tauri/target/release/bundle/nsis/steam-auto-status_${version}_x64-setup.exe"
          if (-not (Test-Path $asset)) { throw "No se encontró el instalador: $asset" }
          "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # La release ya existía: solo actualizamos el instalador.
            gh release upload $tag $env:ASSET --clobber
          } else {
            $args = @('release', 'create', $tag, $env:ASSET, '--title', "Steam Auto Status $tag")
            $notes = "release-notes/$tag.md"
            if (Test-Path $notes) { $args += @('--notes-file', $notes) } else { $args += '--generate-notes' }
            if ($tag -match '-') { $args += '--prerelease' }
            gh @args
          }

      - name: Subir instalador como artifact (solo dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ${{ env.ASSET }}
